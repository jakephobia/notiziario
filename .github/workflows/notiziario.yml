name: Notiziario quotidiano

on:
  schedule:
    # Ogni 30 minuti: il controllo in Europe/Rome recupera la generazione mancante.
    - cron: "*/30 * * * *"
  workflow_dispatch:
    inputs:
      durata:
        description: "Durata dell'episodio"
        required: true
        default: standard
        type: choice
        options:
          - svelto
          - standard
          - completo
      adesso:
        description: "Data/ora ISO di riferimento (opzionale, es. 2026-11-24T11:00:00+01:00)"
        required: false
        default: ""

permissions:
  contents: write
  issues: write

concurrency:
  group: notiziario
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: "1"
  PYTHONUTF8: "1"

jobs:
  episodio:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa ffmpeg
        run: sudo apt-get update && sudo apt-get install -y ffmpeg

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt

      - name: Controlla orario
        id: orario
        run: echo "run=$(python -m notiziario.orario --controlla)" >> "$GITHUB_OUTPUT"

      - name: Applica dashboard
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          GITHUB_ISSUE_CATEGORIE: ${{ vars.GITHUB_ISSUE_CATEGORIE }}
        run: python -m notiziario.dashboard --applica

      - name: Genera episodio
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GOOGLE_CLOUD_TTS_API_KEY: ${{ secrets.GOOGLE_CLOUD_TTS_API_KEY }}
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_ISSUE_CATEGORIE: ${{ vars.GITHUB_ISSUE_CATEGORIE }}
        run: |
          DURATA="${{ github.event.inputs.durata || 'standard' }}"
          ADESSO="${{ github.event.inputs.adesso }}"
          ARGS=(
            --durata "$DURATA"
            --feed-base-url "https://github.com/${{ github.repository }}/releases/download"
            --feed-site-url "https://${{ github.repository_owner }}.github.io/${{ github.event.repository.name }}/"
          )
          if [ -n "$ADESSO" ]; then
            ARGS+=(--adesso "$ADESSO")
          fi
          python main.py "${ARGS[@]}"

      - name: Pubblica release con mp3
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          DATA=$(TZ=Europe/Rome date +%F)
          python -m notiziario.pubblica \
            --tag "episodio-$DATA" \
            --file "output/notiziario-$DATA.mp3" \
            --body-file "output/copione-$DATA.md" \
            --title "Notiziario del $DATA"

      - name: Verifica asset release
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        run: |
          DATA=$(TZ=Europe/Rome date +%F)
          python -m notiziario.pubblica \
            --verifica-url "https://github.com/${{ github.repository }}/releases/download/episodio-$DATA/notiziario-$DATA.mp3"

      - name: Aggiorna feed, sito e stato nel repository
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add docs state/visti.json config/
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Aggiorna feed notiziario $(TZ=Europe/Rome date +%F)"
            if ! git pull --rebase; then
              echo "::error::Rebase fallito: conflitto con il remoto. Risolvi manualmente; nessun push forzato."
              git rebase --abort || true
              exit 1
            fi
            git push
          fi

      - name: Notifica episodio
        if: ${{ github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true' }}
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ISSUE_NOTIFICHE: ${{ vars.ISSUE_NOTIFICHE }}
        run: |
          if [ -z "$ISSUE_NOTIFICHE" ]; then
            echo "ISSUE_NOTIFICHE non impostata: salto il commento."
            exit 0
          fi
          python -m notiziario.notifica > output/notifica.md
          gh issue comment "$ISSUE_NOTIFICHE" --body-file output/notifica.md

      - name: Email episodio
        if: ${{ (github.event_name == 'workflow_dispatch' || steps.orario.outputs.run == 'true') && env.MAIL_TO != '' }}
        continue-on-error: true
        env:
          MAIL_TO: ${{ secrets.MAIL_TO }}
          SMTP_HOST: ${{ secrets.SMTP_HOST }}
          SMTP_PORT: ${{ secrets.SMTP_PORT }}
          SMTP_USER: ${{ secrets.SMTP_USER }}
          SMTP_PASSWORD: ${{ secrets.SMTP_PASSWORD }}
        run: python -m notiziario.notifica --email

      # Pages pubblica docs/ da main: impostazione del repository, nessun artifact.
