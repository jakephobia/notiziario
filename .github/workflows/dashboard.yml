name: Dashboard impostazioni

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Payload JSON delle impostazioni"
        required: true
        type: string
      genera:
        description: "Avvia il notiziario dopo il salvataggio"
        required: false
        default: true
        type: boolean
      durata:
        description: "Durata dell'episodio"
        required: true
        default: completo
        type: choice
        options:
          - svelto
          - standard
          - completo
      adesso:
        description: "Data/ora ISO di riferimento per il taglio delle notizie (opzionale)"
        required: false
        default: ""

permissions:
  contents: write
  actions: write
  issues: write

jobs:
  applica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt

      - name: Applica payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: python -m notiziario.dashboard --payload-json "$PAYLOAD" --applica-payload

      - name: Salva configurazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/ docs/impostazioni.json
          if git diff --cached --quiet; then
            echo "Nessuna modifica da committare."
          else
            git commit -m "Dashboard: aggiorna impostazioni"
            if ! git pull --rebase; then
              echo "::error::Rebase fallito: conflitto con il remoto. Risolvi manualmente; nessun push forzato."
              git rebase --abort || true
              exit 1
            fi
            git push
          fi

      - name: Allinea issue impostazioni
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p output
          python -m notiziario.dashboard --genera-corpo --out output/issue-dashboard.md
          gh issue edit 1 --body-file output/issue-dashboard.md

      - name: Avvia generazione
        if: ${{ inputs.genera }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURATA: ${{ inputs.durata }}
          ADESSO: ${{ inputs.adesso }}
        run: |
          if [ -n "$ADESSO" ]; then
            gh workflow run notiziario.yml -f durata="$DURATA" -f adesso="$ADESSO"
          else
            gh workflow run notiziario.yml -f durata="$DURATA"
          fi