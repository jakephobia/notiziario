name: Dashboard impostazioni

on:
  workflow_dispatch:
    inputs:
      payload:
        description: "Payload JSON delle impostazioni"
        required: true
        type: string
      genera:
        description: "Avvia il notiziario dopo il salvataggio"
        required: false
        default: true
        type: boolean
      durata:
        description: "Durata dell'episodio"
        required: true
        default: standard
        type: choice
        options:
          - svelto
          - standard
          - completo

permissions:
  contents: write
  actions: write

jobs:
  applica:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements.txt

      - name: Installa dipendenze
        run: python -m pip install -r requirements.txt

      - name: Applica payload
        env:
          PAYLOAD: ${{ inputs.payload }}
        run: python -m notiziario.dashboard --payload-json "$PAYLOAD" --applica-payload

      - name: Salva configurazione
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add config/
          if git diff --cached --quiet; then
            echo "Nessuna modifica a config/."
          else
            git commit -m "Dashboard: aggiorna impostazioni"
            git push
          fi

      - name: Avvia generazione
        if: ${{ inputs.genera }}
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          DURATA: ${{ inputs.durata }}
        run: gh workflow run notiziario.yml -f durata="$DURATA"