    categoria: tecnologia

  # --- Buone notizie (feed dedicati, verificati il 22 novembre 2026) ---
  # Usati dal blocco finale anche senza AI. Con AI, il filtro di positività
  # può aggiungere notizie positive dai feed generalisti.
  - nome: Buone Notizie
    url: https://www.buonenotizie.it/feed/
    categoria: buone-notizie
    attivo: true

  - nome: Italia Che Cambia
    url: https://www.italiachecambia.org/feed/
    categoria: buone-notizie
    attivo: true

# Campi opzionali delle fonti:
#   attivo: true/false (default true se manca)
#   controllo: ultimo esito del controllo feed
#   ultimo_controllo: data ISO dell'ultimo controllo
#   note: annotazioni libere
#
# Feed testati e scartati il 22 novembre 2026 (non aggiungerli senza riprovare):
# - Corriere della Sera (homepage, esteri, economia, sport, cultura, tecnologia,
#   scienze, ambiente): rispondono ma le date più recenti sono del 2024/2025.
# - Wired Italia: https://www.wired.it/feed/rss/ risponde ma l'ultima data era
#   luglio 2026, quindi non entra mai nelle ultime 24 ore.
# - ANSA Tecnologia e ANSA Ambiente (URL /sito/notizie/...): date ferme al 2023.
# - Il Post homepage: risponde 403; le sezioni singole funzionano.
# - Repubblica Sport, Il Sole 24 Ore Sport, ANSA Italia, Corriere Italia:
#   URL 404 o non aggiornati.
# - HDblog /feed/ con HTTPS dà errore SSL; funziona /rss/.
