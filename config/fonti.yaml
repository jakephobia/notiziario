# Fonti RSS del Notiziario.
#
# Come modificare:
#   - nome: la testata come deve essere pronunciata nel copione (es. "ANSA");
#   - url: l'indirizzo del feed RSS, non della pagina del sito;
#   - categoria: una tra
#       italia, mondo, economia, tecnologia, scienza-salute, cultura, sport, ambiente.
#
# Per aggiungere una fonte copia un blocco "- nome: ..." e cambia i valori.
# Per togliere una fonte cancella il suo blocco.
# Dopo una modifica puoi controllare i feed con:  python -m notiziario.verifica_fonti
#
# URL verificati con richieste reali il 22 novembre 2026.
# Restano solo feed che rispondono e hanno date valide. Alcune sezioni possono
# essere ferme da più di 24 ore: vengono saltate senza errore e si useranno
# quando si aggiorneranno. Le testate con feed davvero fermi sono in fondo.

